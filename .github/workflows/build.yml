
name: Build NOVA OS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin xorriso mtools

      - name: Build kernel
        run: |
          mkdir -p build/boot/grub

          gcc -m32 -c boot.s -o build/boot.o

          gcc -m32 -c kernel.c -o build/kernel.o \
            -std=gnu99 -ffreestanding -fno-pie \
            -fno-stack-protector

          ld -m elf_i386 -T linker.ld \
            -o build/boot/kernel.elf \
            build/boot.o build/kernel.o

          cp grub.cfg build/boot/grub/grub.cfg

          grub-mkrescue -o build/nova-os.iso build

      - name: Save NOVA OS
        uses: actions/upload-artifact@v4
        with:
          name: nova-os
          path: build/nova-os.iso
