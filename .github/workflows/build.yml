
name: Build NOVA OS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin xorriso mtools qemu-system-x86

      - name: Build kernel
        run: |
          mkdir -p build/boot/grub

          gcc -m32 -c boot.s -o build/boot.o

          gcc -m32 -c kernel.c -o build/kernel.o \
            -std=gnu99 -ffreestanding -fno-pie \
            -fno-stack-protector

          ld -m elf_i386 -T linker.ld \
            -o build/boot/kernel.elf \
            build/boot.o build/kernel.o

          cp grub.cfg build/boot/grub/grub.cfg

          grub-mkrescue -o build/nova-os.iso build

      
     
      - name: Test NOVA OS
      
      - name: Test NOVA OS
        run: |
          echo "Checking the kernel format..."
          grub-file --is-x86-multiboot build/boot/kernel.elf

          echo "Starting NOVA OS in QEMU..."
          set +e
          timeout 15s qemu-system-i386 \
            -cdrom build/nova-os.iso \
            -display none \
            -serial none \
            -monitor none \
            -no-reboot \
            -no-shutdown \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          result=$?
          set -e

          if [ "$result" -ne 33 ]; then
            echo "BOOT TEST FAILED: exit code $result"
            exit 1
          fi

          echo "SUCCESS: NOVA OS reached its test checkpoint!"

    
